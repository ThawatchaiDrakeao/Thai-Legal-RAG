name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt pytest

      - name: Rebuild data pipeline (chunks + embeddings + FAISS index)
        run: |
          python src/ingest_csv.py || true
          python src/chunk_documents.py
          python src/build_embeddings.py

      - name: Run tests
        run: pytest tests/ -v
